name: Setup Shawtie workspace
description: Pin Node, install the committed npm graph, and prove exact candidate checkout integrity.

inputs:
  expected-sha:
    description: Exact Git commit SHA expected in the workspace.
    required: true

outputs:
  sha:
    description: Checked out Git commit SHA.
    value: ${{ steps.candidate.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22.18.0"
        check-latest: false

    - name: Runtime versions
      shell: bash
      run: |
        node --version
        npm --version

    - name: Install dependencies from lockfile
      shell: bash
      run: npm ci --ignore-scripts

    - name: Assert exact candidate SHA
      id: candidate
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: |
        set -euo pipefail
        actual_sha="$(git rev-parse HEAD)"
        echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
        echo "checked_out_sha=$actual_sha"
        test "$actual_sha" = "$EXPECTED_SHA"
