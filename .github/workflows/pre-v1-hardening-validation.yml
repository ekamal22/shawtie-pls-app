name: Pre-V1 Hardening Validation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pre-v1-hardening-validation.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  focused:
    name: Follow-up hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/pre-v1-follow-up-hardening
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"
          check-latest: false

      - name: Install from lockfile
        run: npm ci

      - name: Focused hardening tests
        run: npm run test:pre-v1:hardening

      - name: Lint
        run: npm run lint

      - name: Prettier diagnostic
        run: npx prettier apps/web/tests/s1.browser.test.ts

      - name: Format check
        run: npm run format:check

      - name: Worktree hygiene
        run: git diff --check
