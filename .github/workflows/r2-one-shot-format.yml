name: R2 One Shot Format
# One-shot formatting helper. Remove after it commits a clean branch.

on:
  push:
    branches:
      - feat/r2-public-readiness
    paths:
      - ".github/workflows/r2-one-shot-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout R2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/r2-public-readiness
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install exact workspace
        run: npm ci --ignore-scripts
      - name: Apply repository formatting
        run: npm run format
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "R2_FORMAT_ALREADY_CLEAN"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps packages package.json package-lock.json
          git commit -m "style: format R2 implementation [skip ci]"
          git push origin HEAD:feat/r2-public-readiness
