[package]
name = "shawtie-openmls-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
openmls = { version = "=0.9.0", features = ["js"] }
openmls_basic_credential = { version = "=0.6.0" }
openmls_memory_storage = { version = "=0.6.0" }
openmls_rust_crypto = { version = "=0.6.0" }
openmls_traits = { version = "=0.6.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tls_codec = { version = "0.5", features = ["derive", "serde", "mls"] }
wasm-bindgen = "0.2.104"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
